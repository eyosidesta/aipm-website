# Reference spec for the AIPM API on DigitalOcean App Platform.
# The app is managed from the DigitalOcean dashboard. Secret values
# (DATABASE_URL, ACCESS_TOKEN_SECRET, REFRESH_TOKEN_SECRET) are set there as
# encrypted environment variables and are never stored in this file.
# The database is Neon (not a DigitalOcean database).
name: aipm-api
region: fra
services:
  - name: api
    github:
      repo: eyosidesta/aipm-website
      branch: master
      deploy_on_push: true
    source_dir: aipm_api
    dockerfile_path: aipm_api/Dockerfile
    http_port: 3000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /
    envs:
      - key: NODE_ENV
        value: production
      - key: DB_SSL
        value: "true"
      - key: CORS_ORIGIN
        value: https://www.aipmethiopia.com,https://aipmethiopia.com
      # Set in the dashboard as encrypted (SECRET) values:
      # DATABASE_URL, ACCESS_TOKEN_SECRET, REFRESH_TOKEN_SECRET
